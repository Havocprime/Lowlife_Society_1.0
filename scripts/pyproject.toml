[project]
name = "lowlife"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "discord.py>=2.4.0",
  "python-dotenv>=1.0.1",
  "pydantic>=2.8.0",
  "pyyaml>=6.0.1",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E","F","I","B","UP","N"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["GAME/src"]
addopts = "-q"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
